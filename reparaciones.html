
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Reparaciones | Taller Luigi Biker</title>
  <link rel="stylesheet" href="css/reparaciones.css">
  <script type="module" src="js/reparaciones.js"></script>
</head>
<body>

  <div id="verificando" class="verificando">
    Verificando acceso...
  </div>

  <main id="contenido" class="contenedor" hidden>
    <a href="admin.html" class="volver">
      ← Volver al administrador
    </a>

    <header class="encabezado">
      <div>
        <span>🏍️ TALLER LUIGI BIKER</span>
        <h1>Gestión de reparaciones</h1>
        <p>Registra y controla los trabajos del taller.</p>
      </div>
    </header>

    <section class="panel">
      <h2>🔧 Nueva orden de reparación</h2>

      <form id="form-reparacion">
        <div class="grid">

          <div class="campo">
            <label for="moto">Motocicleta *</label>
            <select id="moto" required>
              <option value="">Cargando motos...</option>
            </select>
          </div>

          <div class="campo">
            <label for="mecanico">Mecánico asignado</label>
            <select id="mecanico">
              <option value="">Sin asignar</option>
            </select>
          </div>

          <div class="campo">
            <label for="estado">Estado *</label>
            <select id="estado" required>
              <option value="recibida">Recibida</option>
              <option value="en_reparacion">En reparación</option>
              <option value="finalizada">Finalizada</option>
            </select>
          </div>

          <div class="campo">
            <label for="costo">Costo de mano de obra (Bs.)</label>
            <input id="costo" type="number"
                   min="0" step="0.01" value="0" required>
          </div>
        </div>

        <div class="campo">
          <label for="descripcion">Trabajo solicitado *</label>
          <textarea id="descripcion" rows="3"
                    placeholder="Ej: Cambio de frenos..."
                    required></textarea>
        </div>

        <div class="campo">
          <label for="diagnostico">Diagnóstico</label>
          <textarea id="diagnostico" rows="3"
                    placeholder="Observaciones del mecánico..."></textarea>
        </div>

        <button id="guardar" type="submit" disabled>
          Guardar orden de reparación
        </button>

        <p id="mensaje-form" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="titulo-lista">
        <h2>📋 Reparaciones registradas</h2>
        <button id="actualizar" type="button">
          ↻ Actualizar
        </button>
      </div>

      <div class="campo">
        <label for="buscar">Buscar</label>
        <input id="buscar" type="search"
               placeholder="Buscar por placa, propietario o trabajo">
      </div>

      <p id="mensaje-lista" role="status">
        Cargando reparaciones...
      </p>

      <div id="lista" class="lista"></div>
    </section>
  </main>

</body>
</html>
