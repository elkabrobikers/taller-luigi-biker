
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Taller Luigi Biker</title>
  <link rel="stylesheet" href="./css/login.css">
  <script type="module" src="./js/login.js"></script>
</head>
<body>
  <main class="contenedor-login">
    <section class="formulario-login">
      <a href="./index.html" class="volver">
        ← Volver al inicio
      </a>

      <div class="caja-login">
        <div class="icono">🏍️</div>

        <h1>Bienvenido</h1>
        <p class="subtitulo">
          Ingresa a tu cuenta de Taller Luigi Biker
        </p>

        <form id="form-login">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com"
            autocomplete="username"
            required
          >

          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >

          <button type="submit" id="btn-login">
            Iniciar sesión
          </button>

          <p
            id="mensaje"
            class="mensaje"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <button
          type="button"
          id="btn-recuperar"
          class="enlace-recuperar"
        >
          ¿Olvidaste tu contraseña?
        </button>

        <div class="ayuda">
          <p>¿Necesitas una cuenta?</p>
          <p>Comunícate con el administrador del taller.</p>
        </div>
      </div>

      <p class="pie">Taller Luigi Biker © 2026</p>
    </section>
  </main>
</body>
</html>
